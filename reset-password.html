<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>إعادة تعيين كلمة المرور | الطوفان سوشيال</title>
  <meta name="robots" content="noindex">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #080b12;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 420px;
      padding: 28px;
      border: 1px solid #263449;
      border-radius: 18px;
      background: #111827;
    }
    h1 { font-size: 24px; }
    p { color: #b9c4d4; line-height: 1.7; }
    input, button {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border-radius: 9px;
      font-size: 16px;
    }
    input {
      border: 1px solid #374151;
      background: #080b12;
      color: white;
    }
    button {
      border: 0;
      background: #3478f6;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .6; }
    #message { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main class="card">
    <h1>🔐 تغيير كلمة المرور</h1>
    <p>أدخل كلمة مرور جديدة لحسابك في الطوفان سوشيال.</p>

    <form id="reset-form">
      <input id="password" type="password" minlength="8"
        autocomplete="new-password" placeholder="كلمة المرور الجديدة"
        required>
      <input id="confirm" type="password" minlength="8"
        autocomplete="new-password" placeholder="تأكيد كلمة المرور"
        required>
      <button id="submit" type="submit">حفظ كلمة المرور</button>
    </form>

    <p id="message" role="status"></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script>
    const form = document.getElementById("reset-form");
    const message = document.getElementById("message");
    const button = document.getElementById("submit");

    function show(text) {
      message.textContent = text;
    }

    async function initialize() {
      const hash = new URLSearchParams(location.hash.slice(1));
      const query = new URLSearchParams(location.search);
      const error = hash.get("error_description") ||
                    query.get("error_description");

      if (error) {
        show("رابط الاستعادة غير صالح أو انتهت صلاحيته. اطلب رسالة جديدة.");
        form.hidden = true;
        return;
      }

      const tokenHash = query.get("token_hash");
      const type = query.get("type");

      if (tokenHash && type === "recovery") {
        const { error } = await supabaseClient.auth.verifyOtp({
          token_hash: tokenHash,
          type: "recovery"
        });
        if (error) {
          show("تعذر التحقق من الرابط. اطلب رسالة استعادة جديدة.");
          form.hidden = true;
          return;
        }
      } else {
        const accessToken = hash.get("access_token");
        const refreshToken = hash.get("refresh_token");
        if (accessToken && refreshToken) {
          const { error } = await supabaseClient.auth.setSession({
            access_token: accessToken,
            refresh_token: refreshToken
          });
          if (error) {
            show("تعذر التحقق من الرابط. اطلب رسالة استعادة جديدة.");
            form.hidden = true;
            return;
          }
        }
      }

      const { data } = await supabaseClient.auth.getSession();
      if (!data.session) {
        show("افتح رابط الاستعادة الجديد الذي وصلك بالبريد الإلكتروني.");
        form.hidden = true;
        return;
      }

      show("أدخل كلمة مرور جديدة لا تقل عن 8 أحرف.");
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();

      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirm").value;

      if (password.length < 8) {
        show("كلمة المرور يجب أن تكون 8 أحرف على الأقل.");
        return;
      }
      if (password !== confirm) {
        show("كلمتا المرور غير متطابقتين.");
        return;
      }

      button.disabled = true;
      show("جارٍ حفظ كلمة المرور...");

      try {
        const { data } = await supabaseClient.auth.getSession();
        if (!data.session) {
          show("انتهت جلسة الاستعادة. اطلب رسالة جديدة.");
          return;
        }

        const { error } = await supabaseClient.auth.updateUser({
          password
        });

        if (error) {
          show("تعذر تغيير كلمة المرور: " + error.message);
          return;
        }

        show("تم تغيير كلمة المرور بنجاح. يمكنك الآن تسجيل الدخول.");
        form.hidden = true;
        await supabaseClient.auth.signOut();
      } catch {
        show("حدث خطأ في الاتصال. حاول مرة أخرى.");
      } finally {
        button.disabled = false;
      }
    });

    initialize().catch(() => {
      show("تعذر التحقق من رابط الاستعادة. اطلب رسالة جديدة.");
      form.hidden = true;
    });
  </script>
</body>
</html>
